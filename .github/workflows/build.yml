name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ustaw Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.1.0

      - name: Pobierz najnowsze wersje Yarn i Fabric API dla 1.21.11
        working-directory: kursorplik-mod
        run: |
          YARN=$(curl -s https://meta.fabricmc.net/v2/versions/yarn/1.21.11 | jq -r '.[0].version')
          FABRIC=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml \
            | grep -o '<version>[^<]*+1.21.11</version>' | tail -1 | sed 's/<[^>]*>//g')
          echo "Yarn: $YARN"
          echo "Fabric API: $FABRIC"
          sed -i "s|^yarn_mappings=.*|yarn_mappings=$YARN|" gradle.properties
          sed -i "s|^fabric_version=.*|fabric_version=$FABRIC|" gradle.properties

      - name: Zbuduj mod
        working-directory: kursorplik-mod
        run: gradle build

      - name: Wgraj jar
        uses: actions/upload-artifact@v4
        with:
          name: kursorplik
          path: kursorplik-mod/build/libs/kursorplik-1.0.0.jar
